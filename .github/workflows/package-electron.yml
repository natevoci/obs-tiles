name: Package Electron and Create Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v3

      - name: Get version from package.json
        id: version
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          echo "VERSION=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Check if release exists
        id: check_release
        run: |
          gh release view ${{ steps.version.outputs.VERSION }} --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            echo "EXISTS=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            echo "EXISTS=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }
          exit 0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        if: steps.check_release.outputs.EXISTS == 'false'
        uses: actions/setup-node@v3
        with:
          node-version: '25'

      - name: Install dependencies
        if: steps.check_release.outputs.EXISTS == 'false'
        run: yarn install --frozen-lockfile

      - name: Build and package Electron app
        if: steps.check_release.outputs.EXISTS == 'false'
        run: yarn package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        if: steps.check_release.outputs.EXISTS == 'false'
        uses: softprops/action-gh-release@v1
        with:
          files: dist/obs-tiles-*.exe
          tag_name: ${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
